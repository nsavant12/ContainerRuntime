name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test vet all
      - run: sudo modprobe overlay
      - run: sudo python3 scripts/integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: docs/integration-results.json
  cross-compile:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make all GOARCH=${{ matrix.arch }}
# Benchmarks are intentionally manual: shared CI hosts do not offer stable
# timing or dedicated CPU/memory. Use `make benchmark` on a documented host.
